[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator for A-Maze-ing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]

[tool.setuptools]
packages = ["mazegen"]

[tool.mypy]
exclude = '(^|/)(build|dist|env|venv|\.venv|__pycache__|.*\.egg-info)(/|$)'
